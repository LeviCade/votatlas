name: Verify workspace, fixtures and build

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main, 'feature/v0.1-**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-source:
    name: Reproducible Census IDs and synthetic ballots (no dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic source, 95 county GEOIDs and manifest digest
        run: node scripts/generate-tennessee-fixture.mjs --check
      - name: Run real TypeScript validator regressions without dependencies
        run: node --experimental-strip-types --test scripts/standalone-validation.test.mjs

  verify:
    needs: fixture-source
    name: Typecheck / tests / build / provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Require reproducible workspace lockfile
        run: |
          test -f pnpm-lock.yaml || { echo 'ERROR: conductor must commit root pnpm-lock.yaml'; exit 1; }
      - name: Fresh locked install
        run: pnpm install --frozen-lockfile
      - name: Workspace typecheck
        run: pnpm typecheck
      - name: Workspace unit tests
        run: pnpm test
      - name: Workspace build
        run: pnpm build
      - name: Verify deterministic fixtures and provenance
        run: node scripts/check-fixtures.mjs
