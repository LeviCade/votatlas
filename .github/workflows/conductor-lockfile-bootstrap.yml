name: Bootstrap locked workspace dependencies (conductor)
on:
  push:
    branches: ["conductor/v0.1-deps"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conductor-lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Materialize all three unmerged engineer workspace package manifests
        run: |
          set -euo pipefail
          git fetch origin \
            'refs/heads/feature/v0.1-e1-map-ui:refs/remotes/origin/feature/v0.1-e1-map-ui' \
            'refs/heads/feature/v0.1-e2-candidate-engine:refs/remotes/origin/feature/v0.1-e2-candidate-engine' \
            'refs/heads/feature/v0.1-e3-data-ci:refs/remotes/origin/feature/v0.1-e3-data-ci'
          git checkout origin/feature/v0.1-e1-map-ui -- apps/web packages/map
          git checkout origin/feature/v0.1-e2-candidate-engine -- packages/sim-core
          git checkout origin/feature/v0.1-e3-data-ci -- packages/data
      - name: Generate deterministic workspace lockfile from real registry resolutions
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit only conductor-owned root lockfile
        run: |
          set -euo pipefail
          git reset
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already current"
          else
            git -c user.name='Votatlas Conductor' -c user.email='147657883+LeviCade@users.noreply.github.com' commit -m "build: pin workspace dependencies for all three engineer PRs"
            git push origin HEAD:conductor/v0.1-deps
          fi
      - name: Archive generated lockfile for conductor
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
